
name: Build Supernote Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build plugin
        run: |
          chmod +x buildPlugin.sh
          ./buildPlugin.sh

      - name: Verify plugin package
        run: |
          test -s build/outputs/SuperDashboard.snplg
          unzip -t build/outputs/SuperDashboard.snplg
          unzip -l build/outputs/SuperDashboard.snplg
          unzip -p build/outputs/SuperDashboard.snplg PluginConfig.json > /tmp/plugin-config.json
          python3 -c 'import json; c=json.load(open("/tmp/plugin-config.json")); assert c.get("nativeCodePackage") == "/app.npk", "Missing native package"'
          unzip -l build/outputs/SuperDashboard.snplg | grep 'app.npk'

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: MySuperPrettyDashboard
          path: build/outputs/SuperDashboard.snplg
          if-no-files-found: error

