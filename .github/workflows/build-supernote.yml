
name: Build Supernote Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - development/smartynote-four-quadrants

concurrency:
  group: smartynote-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006'
          log-accepted-android-sdk-licenses: 'false'

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          java -version
          sdkmanager --version
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/27.1.12297006"
          test -f android/gradlew
          test -f package-lock.json
          test -f PluginConfig.json

      - name: Prepare approved release icons and font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/fonts
          curl --fail --silent --show-error --location --retry 3             "https://raw.githubusercontent.com/google/fonts/main/ofl/googlesansflex/GoogleSansFlex%5BROND%2Copsz%2Cslnt%2Cwdth%2Cwght%5D.ttf"             --output android/app/src/main/assets/fonts/GoogleSansFlex.ttf
          curl --fail --silent --show-error --location --retry 3             "https://raw.githubusercontent.com/google/fonts/main/ofl/googlesansflex/OFL.txt"             --output android/app/src/main/assets/fonts/OFL.txt
          python3 -m venv /tmp/pretty-icons-venv
          /tmp/pretty-icons-venv/bin/pip -q install cairosvg pillow fonttools
          /tmp/pretty-icons-venv/bin/python scripts/generate_pretty_assets.py
          /tmp/pretty-icons-venv/bin/python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          root = Path("android/app/src/main/assets/fonts")
          for weight in (400,500,600,650,700):
              font=TTFont(root/"GoogleSansFlex.ttf")
              axes={a.axisTag:a.defaultValue for a in font["fvar"].axes}
              axes["wght"]=weight
              result=instantiateVariableFont(font,axes,inplace=True,updateFontNames=False)
              result.save(root/f"GoogleSansFlex{weight}.ttf")
          PY
          test -s assets/pretty/lizard.png
          test -s android/app/src/main/assets/fonts/GoogleSansFlex.ttf
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("src/PrettyHome.tsx").read_text()
          used = set(re.findall(r"assets/pretty/([\w-]+)\.png", source))
          missing = sorted(icon for icon in used if not (Path("assets/pretty") / (icon + ".png")).is_file())
          if missing:
              raise SystemExit("Missing PrettyHome icons: " + ", ".join(missing))
          print("Icon references verified:", len(used))
          PY

      - name: Embed approved product version and original build ID
        shell: bash
        run: python3 scripts/versioning.py "$GITHUB_RUN_NUMBER" --prepare

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript types
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --noEmit --pretty false

      - name: Test calendar, preferences, layout, task protocol and navigation
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --runInBand src/prettyCalendar.test.ts src/prettyPrefs.test.ts src/prettyHomeNavigation.test.tsx src/prettyCloud.test.ts

      - name: Align SDK library NDK with installed Android NDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("node_modules/sn-plugin-lib/android/build.gradle")
          if not p.exists():
              raise SystemExit("Cannot find SDK Android build.gradle to apply NDK fix")
          source = p.read_text()
          source = re.sub(r"^\s*ndkVersion\s*=?\s*.*$", "", source, flags=re.M)
          if "android {" not in source:
              raise SystemExit("No Android DSL block in SDK library")
          source = source.replace("android {", 'android {\n    ndkVersion rootProject.ext.ndkVersion', 1)
          p.write_text(source)
          print("SDK Android NDK aligned to project 27.1.12297006")
          PY

      - name: Build Supernote plugin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x buildPlugin.sh
          ./buildPlugin.sh

      - name: Verify plugin package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE="build/outputs/${PACKAGE_NAME}.snplg"

          test -s "$PACKAGE"
          cp "$PACKAGE" build/outputs/SmartyNote.snplg
          PACKAGE="build/outputs/SmartyNote.snplg"
          unzip -t "$PACKAGE"

          unzip -p "$PACKAGE" PluginConfig.json \
            > /tmp/plugin-config.json

          python3 - <<'PY'
          import json, os
          from zipfile import ZipFile

          path = "build/outputs/SmartyNote.snplg"

          with open("/tmp/plugin-config.json") as f:
              config = json.load(f)

          with ZipFile(path) as package:
              files = set(package.namelist())

              assert config.get("pluginID"), \
                  "Missing plugin ID"

              assert config.get("name") == "SmartyNote", \
                  "Plugin display name must be SmartyNote"

              assert config.get("versionName") == os.environ["SMARTYNOTE_VERSION"], "Incorrect packaged version name"
              assert str(config.get("versionCode")) == os.environ["GITHUB_RUN_NUMBER"], "Incorrect packaged build code"

              assert config.get("jsMainPath"), \
                  "Missing JS entry point"

              assert config.get("nativeCodePackage") == "/app.npk", \
                  "Missing native package reference"

              assert "app.npk" in files, \
                  "Native package absent"

              assert package.getinfo("app.npk").file_size > 0, \
                  "Native package is empty"

              assert any(
                  name.endswith(".bundle")
                  for name in files
              ), "JavaScript bundle missing"

              from io import BytesIO
              retired = ("weather_iconic", "weather-iconic", "weather_", "weather-", "rocky", "possum", "temperature_gauge", "temperature-gauge", "cats_placeholder", "cats-placeholder", "icon_clip", "icon-clip", "icon_todo", "icon-todo", "dseg7", "mcnuggets")
              with ZipFile(BytesIO(package.read("app.npk"))) as native:
                  all_names = files | set(native.namelist())
                  unwanted = sorted(n for n in all_names if any(token in n.lower() for token in retired))
                  assert not unwanted, "Retired packaged assets: " + repr(unwanted)
              for name in files:
                  if name.endswith(".bundle"):
                      payload=package.read(name)
                      for text in (b"Dashboard Clip", b"Dashboard To-do", b"Weather Iconic", b"Amaze! Amaze! Amaze!", b"api.open-meteo.com"):
                          assert text not in payload, "Retired runtime feature: "+repr(text)
              assert "licenses/SuperDashboard-MIT.txt" in files
              assert "licenses/GoogleSansFlex-OFL.txt" in files
          print("Package structure and release asset exclusions verified")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartyNote-development
          path: build/outputs/SmartyNote.snplg
          if-no-files-found: error
          retention-days: 14

      - name: Normalize existing release descriptions
        if: github.ref == 'refs/heads/development/smartynote-four-quadrants'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name, (.body // "")] | @base64' |
          while IFS= read -r entry; do
            row="$(printf '%s' "$entry" | base64 --decode)"
            id="$(jq -r '.[0]' <<<"$row")"
            tag="$(jq -r '.[1]' <<<"$row")"
            old="$(jq -r '.[2]' <<<"$row")"
            note="Version $tag."
            if [[ "$old" != "$note" ]]; then
              gh api --method PATCH "repos/${{ github.repository }}/releases/$id" -f body="$note" --silent
            fi
          done

      - name: Publish direct SNPLG development download
        if: github.ref == 'refs/heads/development/smartynote-four-quadrants'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${SMARTYNOTE_VERSION}" \
            build/outputs/SmartyNote.snplg \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "SmartyNote ${SMARTYNOTE_VERSION} (build $GITHUB_RUN_NUMBER)" \
            --notes "Version ${SMARTYNOTE_VERSION}." \
            --prerelease
